<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>简历知识空间工作流</title>
    <style>
        :root {
            color-scheme: light;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #f4f6f8;
            color: #1f2937;
        }

        .page {
            max-width: 1200px;
            margin: 0 auto;
            padding: 24px;
        }

        h1, h2 {
            margin: 0 0 12px;
        }

        .grid {
            display: grid;
            grid-template-columns: 360px 1fr;
            gap: 20px;
        }

        .panel {
            background: #fff;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            padding: 16px;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
        }

        .panel + .panel {
            margin-top: 16px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin: 12px 0 6px;
        }

        input[type="text"], textarea, input[type="file"] {
            width: 100%;
            box-sizing: border-box;
        }

        input[type="text"], textarea {
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            padding: 10px 12px;
            font-size: 14px;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        button {
            margin-top: 12px;
            border: 1px solid #0f766e;
            background: #0f766e;
            color: #fff;
            border-radius: 6px;
            padding: 10px 14px;
            cursor: pointer;
            font-size: 14px;
        }

        button.secondary {
            background: #fff;
            color: #0f766e;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .meta {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin-top: 12px;
            font-size: 13px;
        }

        .meta div {
            background: #f8fafc;
            padding: 8px 10px;
            border-radius: 6px;
        }

        .stream {
            min-height: 220px;
            max-height: 720px;
            overflow: auto;
            background: #0f172a;
            color: #e2e8f0;
            border-radius: 8px;
            padding: 12px;
            white-space: pre-wrap;
            line-height: 1.5;
            font-size: 13px;
        }

        .status {
            margin-top: 10px;
            font-size: 13px;
            color: #475569;
        }

        .section-title {
            margin-bottom: 8px;
            font-size: 16px;
            font-weight: 700;
        }
    </style>
</head>
<body>
<div class="page">
    <h1>简历知识空间工作流</h1>
    <p>先上传简历并生成 Resume Knowledge Space，再做简历评估，最后进入一轮模拟面试。</p>

    <div class="grid">
        <div>
            <div class="panel">
                <h2>第一步：上传并评估</h2>
                <label for="resumeFile">简历 PDF</label>
                <input id="resumeFile" type="file" accept=".pdf">

                <label for="evalQuestion">评估要求</label>
                <textarea id="evalQuestion">请从岗位匹配度、技术深度、项目真实性、优势、风险点和修改建议六个维度评估这份简历。</textarea>

                <button id="uploadBtn">上传简历</button>
                <button id="evaluateBtn" class="secondary" disabled>开始简历评估</button>

                <div class="meta">
                    <div>resumeId: <span id="resumeId">-</span></div>
                    <div>knowledgeSpaceId: <span id="knowledgeSpaceId">-</span></div>
                    <div>knowledgeTag: <span id="knowledgeTag">-</span></div>
                    <div>chunkCount: <span id="chunkCount">-</span></div>
                </div>
                <div id="uploadStatus" class="status">等待上传。</div>
            </div>

            <div class="panel">
                <h2>第二步：模拟面试</h2>
                <button id="startInterviewBtn" disabled>生成面试问题</button>

                <label for="interviewAnswer">本轮回答</label>
                <textarea id="interviewAnswer" placeholder="输入候选人回答"></textarea>
                <button id="answerBtn" class="secondary" disabled>提交回答并继续</button>

                <div class="meta">
                    <div>interviewSessionId: <span id="interviewSessionId">-</span></div>
                    <div>currentRound: <span id="currentRound">-</span></div>
                </div>
                <div id="interviewStatus" class="status">等待简历评估完成后再开始面试。</div>
            </div>
        </div>

        <div>
            <div class="panel">
                <div class="section-title">评估与面试过程流</div>
                <div id="streamOutput" class="stream"></div>
            </div>
        </div>
    </div>
</div>

<script>
    const apiBase = 'http://127.0.0.1:8091/api/v1/resume';
    const state = {
        resumeId: null,
        knowledgeSpaceId: null,
        interviewSessionId: null,
        currentRound: 1,
        openingQuestions: ''
    };

    const streamOutput = document.getElementById('streamOutput');
    const uploadStatus = document.getElementById('uploadStatus');
    const interviewStatus = document.getElementById('interviewStatus');

    function appendOutput(title, content) {
        const block = `[${new Date().toLocaleTimeString()}] ${title}\n${content}\n\n`;
        streamOutput.textContent += block;
        streamOutput.scrollTop = streamOutput.scrollHeight;
    }

    function setMeta(id, value) {
        document.getElementById(id).textContent = value ?? '-';
    }

    async function readSseResponse(response, title) {
        const reader = response.body.getReader();
        const decoder = new TextDecoder();

        while (true) {
            const { done, value } = await reader.read();
            if (done) {
                appendOutput(title, 'SSE 流结束');
                return;
            }

            const chunk = decoder.decode(value, { stream: true });
            chunk.split('\n').forEach(line => {
                if (!line.startsWith('data: ')) {
                    return;
                }
                const data = line.substring(6).trim();
                if (!data) {
                    return;
                }
                try {
                    const json = JSON.parse(data);
                    appendOutput(`${title} / ${json.type || 'event'}`, json.content || JSON.stringify(json));
                } catch (e) {
                    appendOutput(title, data);
                }
            });
        }
    }

    document.getElementById('uploadBtn').addEventListener('click', async () => {
        const fileInput = document.getElementById('resumeFile');
        const file = fileInput.files[0];
        if (!file) {
            uploadStatus.textContent = '请选择简历 PDF。';
            return;
        }

        const formData = new FormData();
        formData.append('file', file);
        uploadStatus.textContent = '上传并解析中...';

        const response = await fetch(`${apiBase}/upload`, {
            method: 'POST',
            body: formData
        });
        const json = await response.json();
        if (!response.ok || !json.data) {
            uploadStatus.textContent = '上传失败。';
            appendOutput('upload-error', JSON.stringify(json));
            return;
        }

        state.resumeId = json.data.resumeId;
        state.knowledgeSpaceId = json.data.knowledgeSpaceId;
        setMeta('resumeId', json.data.resumeId);
        setMeta('knowledgeSpaceId', json.data.knowledgeSpaceId);
        setMeta('knowledgeTag', json.data.knowledgeTag);
        setMeta('chunkCount', json.data.chunkCount);
        uploadStatus.textContent = '上传成功，可以开始简历评估。';
        document.getElementById('evaluateBtn').disabled = false;
        appendOutput('upload-success', JSON.stringify(json.data, null, 2));
    });

    document.getElementById('evaluateBtn').addEventListener('click', async () => {
        if (!state.resumeId || !state.knowledgeSpaceId) {
            return;
        }

        appendOutput('evaluation', '开始简历评估...');
        const response = await fetch(`${apiBase}/evaluate/stream`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                resumeId: state.resumeId,
                knowledgeSpaceId: state.knowledgeSpaceId,
                question: document.getElementById('evalQuestion').value,
                sessionId: `resume-eval-${state.knowledgeSpaceId}`,
                maxStep: 3
            })
        });
        await readSseResponse(response, 'resume-evaluation');
        document.getElementById('startInterviewBtn').disabled = false;
        interviewStatus.textContent = '简历评估完成，可以生成面试问题。';
    });

    document.getElementById('startInterviewBtn').addEventListener('click', async () => {
        const response = await fetch(`${apiBase}/interview/start`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                resumeId: state.resumeId,
                knowledgeSpaceId: state.knowledgeSpaceId
            })
        });
        const json = await response.json();
        if (!response.ok || !json.data) {
            interviewStatus.textContent = '生成面试问题失败。';
            appendOutput('interview-start-error', JSON.stringify(json));
            return;
        }

        state.interviewSessionId = json.data.interviewSessionId;
        state.currentRound = json.data.currentRound;
        state.openingQuestions = json.data.openingQuestions;
        setMeta('interviewSessionId', json.data.interviewSessionId);
        setMeta('currentRound', json.data.currentRound);
        interviewStatus.textContent = '已生成第一轮面试问题，可以输入回答。';
        document.getElementById('answerBtn').disabled = false;
        appendOutput('interview-opening', json.data.openingQuestions);
    });

    document.getElementById('answerBtn').addEventListener('click', async () => {
        const answer = document.getElementById('interviewAnswer').value.trim();
        if (!state.interviewSessionId || !answer) {
            interviewStatus.textContent = '请输入回答后再提交。';
            return;
        }

        appendOutput('interview-answer', answer);
        const response = await fetch(`${apiBase}/interview/answer/stream`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                interviewSessionId: state.interviewSessionId,
                roundNo: state.currentRound,
                answer,
                sessionId: `resume-interview-${state.interviewSessionId}`,
                maxStep: 3
            })
        });
        await readSseResponse(response, 'resume-interview');
        state.currentRound += 1;
        setMeta('currentRound', state.currentRound);
        interviewStatus.textContent = '本轮已完成，可以继续下一轮。';
        document.getElementById('interviewAnswer').value = '';
    });
</script>
</body>
</html>
