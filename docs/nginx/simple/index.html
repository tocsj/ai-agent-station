<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Auto-Agent Station · Simple Console</title>
  <link rel="stylesheet" href="./styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <script defer src="./app.js"></script>
</head>
<body>
  <div class="page">
    <header class="page__header">
      <div>
        <p class="eyebrow">Auto-Agent Station</p>
        <h1>调试前端 · 简洁版</h1>
        <p class="subtitle">快速验证 /api/v1/agent/auto_agent 的 SSE 输出，方便联调与演示。</p>
      </div>
      <div class="status" id="statusBadge">空闲</div>
    </header>

    <main class="layout">
      <section class="panel panel--left">
        <h2>请求设置</h2>
        <form class="form" id="agentForm">
          <label class="field">
            <span>后端地址 (可选，默认同源)</span>
            <input type="text" id="apiBase" placeholder="例如 /api" />
          </label>
          <label class="field">
            <span>AI Agent ID</span>
            <input type="text" id="agentId" placeholder="必填，例如 clients" required />
          </label>
          <label class="field">
            <span>Session ID</span>
            <div class="field__row">
              <input type="text" id="sessionId" required />
              <button type="button" class="ghost" id="regenerateSession">重置</button>
            </div>
          </label>
          <label class="field">
            <span>最大步数</span>
            <input type="number" id="maxStep" min="1" max="8" value="3" />
          </label>
          <label class="field">
            <span>提问内容</span>
            <textarea id="message" rows="4" placeholder="输入要交给 Agent 的任务..." required></textarea>
          </label>
          <div class="form__actions">
            <button type="submit" class="primary" id="sendBtn">发送</button>
            <button type="button" class="secondary" id="stopBtn" disabled>停止</button>
          </div>
        </form>

        <div class="conversation">
          <div class="conversation__header">
            <h3>对话记录</h3>
            <button type="button" class="ghost" id="clearConversation">清空</button>
          </div>
          <div class="conversation__body" id="conversationLog"></div>
        </div>
      </section>

      <section class="panel panel--right">
        <div class="timeline">
          <div class="timeline__header">
            <h2>步骤流</h2>
            <span id="eventCount">0 条</span>
          </div>
          <div class="timeline__body" id="events"></div>
        </div>

        <div class="summary">
          <div class="summary__header">
            <h2>总结输出</h2>
            <button type="button" class="ghost" id="copySummary">复制</button>
          </div>
          <pre id="summaryContent">暂无内容</pre>
        </div>

        <div class="raw">
          <div class="raw__header">
            <h2>Raw SSE</h2>
            <button type="button" class="ghost" id="clearRaw">清空</button>
          </div>
          <pre id="rawLog"></pre>
        </div>
      </section>
    </main>
  </div>

  <template id="eventTemplate">
    <article class="event">
      <header>
        <span class="event__type"></span>
        <span class="event__meta"></span>
      </header>
      <p class="event__content"></p>
      <footer class="event__footer"></footer>
    </article>
  </template>
</body>
</html>
